<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Arşivi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#eef1f6; --surface:#ffffff; --ink:#1b2433; --muted:#6b7689;
    --line:#d9deea; --accent:#2f5bff; --accent-ink:#ffffff; --danger:#c2334d;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Bricolage Grotesque",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5;
    padding:max(16px,env(safe-area-inset-top)) 16px 48px;
  }
  .wrap{max-width:980px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0 28px}
  h1{font-size:clamp(1.9rem,6vw,3rem);font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.05}
  .sub{color:var(--muted);margin:6px 0 0}
  button,input{font:inherit}
  .btn{
    border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;
    background:var(--accent);color:var(--accent-ink);
  }
  .btn:disabled{opacity:.6;cursor:progress}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .admin{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:18px;margin-bottom:24px;display:none;
  }
  .admin.on{display:block}
  .admin h2{margin:0 0 12px;font-size:1.05rem}
  .row{display:grid;gap:10px;grid-template-columns:1fr}
  @media(min-width:700px){.row{grid-template-columns:1fr 2fr auto}}
  input{
    width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    background:#fff;color:var(--ink);
  }
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .thumb{
    aspect-ratio:16/9;background:#dfe4ef;color:var(--muted);width:100%;
    display:flex;align-items:center;justify-content:center;
    font-size:1.6rem;font-weight:800;letter-spacing:.02em;
  }
  .body{padding:14px;display:flex;flex-direction:column;gap:12px;flex:1}
  .title{font-weight:600;margin:0;overflow-wrap:anywhere}
  .actions{display:flex;gap:8px;margin-top:auto}
  .actions .btn{flex:1}
  .empty,.notice{
    border:1px dashed var(--line);border-radius:14px;padding:32px 20px;text-align:center;color:var(--muted);background:var(--surface)
  }
  .notice{border-style:solid;color:var(--danger);text-align:left}
  .notice code{background:var(--bg);padding:2px 6px;border-radius:6px}
  dialog{border:0;border-radius:16px;padding:22px;width:min(92vw,380px);color:var(--ink)}
  dialog::backdrop{background:rgba(27,36,51,.5)}
  dialog h2{margin:0 0 14px}
  dialog form{display:grid;gap:10px}
  .msg{color:var(--danger);min-height:1.2em;margin:0;font-size:.92rem}
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;display:none;max-width:90vw}
  .toast.on{display:block}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Video Arşivi</h1>
      <p class="sub">İndirmek istediğin videonun altındaki düğmeye bas.</p>
    </div>
    <div>
      <button class="btn ghost" id="adminBtn">Yönetici girişi</button>
    </div>
  </header>

  <section class="admin" id="adminPanel" aria-label="Yönetici paneli">
    <h2>Yeni video ekle</h2>
    <div class="row">
      <input id="newTitle" placeholder="Başlık" autocomplete="off">
      <input id="newUrl" type="url" placeholder="Video bağlantısı (https://…/video.mp4)" autocomplete="off">
      <button class="btn" id="addBtn">Ekle</button>
    </div>
    <p class="msg" id="addMsg"></p>
    <h2 style="margin-top:14px">Ya da bilgisayardan / telefondan yükle</h2>
    <div class="row">
      <input id="upTitle" placeholder="Başlık" autocomplete="off">
      <input id="upFile" type="file" accept="video/*">
      <button class="btn" id="upBtn">Yükle</button>
    </div>
    <p class="msg" id="upMsg"></p>
  </section>

  <div id="configNotice" class="notice" hidden></div>
  <main id="list" class="grid" aria-live="polite"></main>
</div>

<dialog id="loginDlg">
  <h2>Yönetici girişi</h2>
  <form id="loginForm" method="dialog">
    <input id="email" type="email" placeholder="E-posta" autocomplete="username" required>
    <input id="password" type="password" placeholder="Şifre" autocomplete="current-password" required>
    <p class="msg" id="loginMsg"></p>
    <button class="btn" type="submit">Giriş yap</button>
    <button class="btn ghost" type="button" id="closeLogin">Vazgeç</button>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
/* ====== AYARLAR: Supabase panelinden (Project Settings → API) kopyala ====== */
const SUPABASE_URL = "https://rqlalodhykfsdhxuawhc.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxbGFsb2RoeWtmc2RoeHVhd2hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MDIyNDUsImV4cCI6MjEwODQ3ODI0NX0.Ip_8fZDYYLTxRes2QLcmmOGUGrkZsr7cV9wugCcOufk";
/* ======================================================================== */

const $ = (id) => document.getElementById(id);
const configured = !SUPABASE_URL.includes("PROJE_KODUN") && !SUPABASE_ANON_KEY.includes("ANAHTARIN");
let sb = null;
let isAdmin = false;

function toast(text){
  const t = $("toast"); t.textContent = text; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("on"), 3000);
}

function fileName(title, url, blobType){
  let ext = "";
  try { const m = new URL(url).pathname.match(/\.([a-z0-9]{2,5})$/i); if (m) ext = "." + m[1].toLowerCase(); } catch(e){}
  if (!ext && blobType && blobType.startsWith("video/")) ext = "." + blobType.split("/")[1].split(";")[0];
  if (!ext) ext = ".mp4";
  const safe = (title || "video").replace(/[\\/:*?"<>|]+/g, "").trim() || "video";
  return safe + ext;
}

const STORAGE_PREFIX = SUPABASE_URL + "/storage/v1/object/public/videos/";

async function download(item, btn){
  // Supabase Storage'daki videolar: sunucu dosyayı doğrudan "indirme" olarak sunar.
  if(item.url.startsWith(STORAGE_PREFIX)){
    const a = document.createElement("a");
    a.href = item.url + "?download=" + encodeURIComponent(fileName(item.title, item.url));
    a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    toast("İndirme başladı");
    return;
  }
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "Hazırlanıyor…";
  try{
    const res = await fetch(item.url);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const total = +res.headers.get("content-length") || 0;
    const reader = res.body.getReader();
    const chunks = []; let got = 0;
    for(;;){
      const {done, value} = await reader.read();
      if(done) break;
      chunks.push(value); got += value.length;
      btn.textContent = total ? "İndiriliyor %" + Math.round(got/total*100) : "İndiriliyor…";
    }
    const blob = new Blob(chunks, {type: res.headers.get("content-type") || "video/mp4"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = fileName(item.title, item.url, blob.type);
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    toast("İndirme başladı");
  }catch(err){
    // Kaynak sunucu doğrudan indirmeye izin vermiyorsa (CORS), tarayıcıya bırak.
    const a = document.createElement("a");
    a.href = item.url; a.download = fileName(item.title, item.url);
    a.target = "_blank"; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    toast("Doğrudan indirme engellendi, bağlantı yeni sekmede açıldı");
  }finally{
    btn.disabled = false; btn.textContent = label;
  }
}

function render(items){
  const list = $("list"); list.replaceChildren();
  if(!items.length){
    const e = document.createElement("div"); e.className = "empty";
    e.textContent = isAdmin ? "Henüz video yok. Yukarıdan bir bağlantı ekle." : "Henüz video eklenmedi.";
    list.appendChild(e); return;
  }
  for(const item of items){
    const card = document.createElement("article"); card.className = "card";

    const v = document.createElement("div");
    v.className = "thumb";
    v.textContent = fileName("", item.url).replace(/^.*\./, ".");
    card.appendChild(v);

    const body = document.createElement("div"); body.className = "body";
    const h = document.createElement("h3"); h.className = "title"; h.textContent = item.title;
    body.appendChild(h);

    const actions = document.createElement("div"); actions.className = "actions";
    const dl = document.createElement("button"); dl.className = "btn"; dl.textContent = "İndir";
    dl.addEventListener("click", ()=>download(item, dl));
    actions.appendChild(dl);

    if(isAdmin){
      const del = document.createElement("button"); del.className = "btn danger"; del.textContent = "Sil";
      del.addEventListener("click", async ()=>{
        if(!confirm("Bu video silinsin mi?")) return;
        if(item.url.startsWith(STORAGE_PREFIX)){
          await sb.storage.from("videos").remove([decodeURIComponent(item.url.slice(STORAGE_PREFIX.length))]);
        }
        const {error} = await sb.from("videos").delete().eq("id", item.id);
        if(error){ toast("Silinemedi: " + error.message); return; }
        loadVideos();
      });
      actions.appendChild(del);
    }
    body.appendChild(actions);
    card.appendChild(body);
    list.appendChild(card);
  }
}

async function loadVideos(){
  const {data, error} = await sb.from("videos").select("*").order("created_at", {ascending:false});
  if(error){ toast("Liste alınamadı: " + error.message); return; }
  render(data || []);
}

function setAdmin(on){
  isAdmin = on;
  $("adminPanel").classList.toggle("on", on);
  $("adminBtn").textContent = on ? "Çıkış yap" : "Yönetici girişi";
}

async function init(){
  if(!configured){
    const n = $("configNotice"); n.hidden = false;
    n.innerHTML = "Önce dosyanın içindeki <code>SUPABASE_URL</code> ve <code>SUPABASE_ANON_KEY</code> değerlerini kendi Supabase bilgilerinle değiştir.";
    return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const {data:{session}} = await sb.auth.getSession();
  setAdmin(!!session);
  sb.auth.onAuthStateChange((_e, s)=>{ setAdmin(!!s); loadVideos(); });
  loadVideos();
}

$("adminBtn").addEventListener("click", async ()=>{
  if(!configured) return;
  if(isAdmin){ await sb.auth.signOut(); toast("Çıkış yapıldı"); }
  else { $("loginMsg").textContent = ""; $("loginDlg").showModal(); }
});
$("closeLogin").addEventListener("click", ()=>$("loginDlg").close());

$("loginForm").addEventListener("submit", async (ev)=>{
  ev.preventDefault();
  const {error} = await sb.auth.signInWithPassword({
    email: $("email").value.trim(), password: $("password").value
  });
  if(error){ $("loginMsg").textContent = "Giriş başarısız: e-posta veya şifre hatalı."; return; }
  $("password").value = ""; $("loginDlg").close(); toast("Giriş yapıldı");
});

$("addBtn").addEventListener("click", async ()=>{
  const title = $("newTitle").value.trim();
  const url = $("newUrl").value.trim();
  const msg = $("addMsg"); msg.textContent = "";
  if(!title || !url){ msg.textContent = "Başlık ve bağlantı gerekli."; return; }
  try{ const u = new URL(url); if(!/^https?:$/.test(u.protocol)) throw 0; }
  catch(e){ msg.textContent = "Geçerli bir http(s) bağlantısı gir."; return; }
  const {error} = await sb.from("videos").insert({title, url});
  if(error){ msg.textContent = "Eklenemedi: " + error.message; return; }
  $("newTitle").value = ""; $("newUrl").value = "";
  toast("Video eklendi"); loadVideos();
});

$("upBtn").addEventListener("click", async ()=>{
  const title = $("upTitle").value.trim();
  const file = $("upFile").files[0];
  const msg = $("upMsg"); msg.textContent = "";
  if(!title || !file){ msg.textContent = "Başlık ve video dosyası gerekli."; return; }
  const btn = $("upBtn"); btn.disabled = true; btn.textContent = "Yükleniyor…";
  try{
    const ext = ((file.name.match(/\.([a-z0-9]{2,5})$/i) || [])[1] || "mp4").toLowerCase();
    const path = crypto.randomUUID() + "." + ext;
    const {error: upErr} = await sb.storage.from("videos").upload(path, file, {contentType: file.type || "video/mp4"});
    if(upErr){ msg.textContent = "Yüklenemedi: " + upErr.message; return; }
    const {data} = sb.storage.from("videos").getPublicUrl(path);
    const {error} = await sb.from("videos").insert({title, url: data.publicUrl});
    if(error){ msg.textContent = "Kaydedilemedi: " + error.message; return; }
    $("upTitle").value = ""; $("upFile").value = "";
    toast("Video yüklendi"); loadVideos();
  }finally{
    btn.disabled = false; btn.textContent = "Yükle";
  }
});

init();
</script>
</body>
</html>
